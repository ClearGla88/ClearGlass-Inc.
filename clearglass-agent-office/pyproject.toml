[project]
name = "clearglass-agent-office"
version = "0.1.0"
description = "ClearGlass Agent Office: a governed headquarters for ClearGlass Inc.'s AI agents."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["packages", "."]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = [
    "S101",   # assert is used for internal invariants and in tests
    "S311",   # random.Random drives seeded simulations, never security decisions
    "S608",   # SQL strings are built from fixed column lists; values are always bound parameters
    "B008",   # FastAPI dependency defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["agent_core", "policy_engine", "audit_ledger", "memory_vault", "tool_registry", "simulation", "apps"]
