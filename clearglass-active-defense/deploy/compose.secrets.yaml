# Host-side twin of compose.defense.yaml used only to generate ./secrets with init-secrets.
schema_version: 1
environment: lab
mode: observe
policy_version: pv-2026-11-17.1
authorization_scope: clearglass-lab-01
database: /data/active_defense.db
state_dir: /data
assets_file: ../config/assets.example.yaml
rules_file: ../rules/detections.yaml
playbooks_dir: ../playbooks
ingest:
  max_body_bytes: 65536
  clock_skew_seconds: 300
  max_event_age_seconds: 86400
  nonce_ttl_seconds: 900
  signature_failure_burst: 5
  signature_failure_window_seconds: 300
response:
  adapter: mock
  approval_ttl_seconds: 3600
  execute_within_seconds: 900
  max_isolations_per_case: 1
  max_concurrent_isolations: 1
  max_actions_per_hour: 3
  adapter_timeout_seconds: 10
  max_attempts: 3
  retry_backoff_seconds: 30
  lease_seconds: 120
  circuit_breaker_threshold: 3
  review_deadline_hours: 24
evidence:
  retention_days: 90
  max_artifact_bytes: 65536
sensors:
- id: sensor-http-01
  kind: http_honeypot
  key_file: ../secrets/sensor-http-01.key
  allowed_categories:
  - honeypot.http.request
- id: sensor-tcp-01
  kind: tcp_tripwire
  key_file: ../secrets/sensor-tcp-01.key
  allowed_categories:
  - tripwire.tcp.connect
- id: sensor-file-01
  kind: honeyfile
  host_asset_id: lab-ws-002
  key_file: ../secrets/sensor-file-01.key
  allowed_categories:
  - honeyfile.access
  - honeyfile.modify
- id: sensor-edr-01
  kind: edr_mock
  asserts_asset_identity: true
  key_file: ../secrets/sensor-edr-01.key
  allowed_categories:
  - endpoint.alert
- id: sensor-flow-01
  kind: flow_monitor
  key_file: ../secrets/sensor-flow-01.key
  allowed_categories:
  - network.flow
- id: sensor-integrity-01
  kind: integrity_monitor
  key_file: ../secrets/sensor-integrity-01.key
  allowed_categories:
  - sensor.health
principals:
- principal: analyst-1
  role: analyst
  token_file: ../secrets/analyst-1.token
- principal: approver-1
  role: approver
  token_file: ../secrets/approver-1.token
- principal: approver-2
  role: approver
  token_file: ../secrets/approver-2.token
- principal: admin-1
  role: admin
  token_file: ../secrets/admin-1.token
