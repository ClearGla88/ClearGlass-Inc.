[project]
name = "clearglass-active-defense"
version = "0.1.0.dev0"
description = "Lab-first deception, correlation and governed containment for ClearGlass Inc."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -p no:cacheprovider"

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "BLE"]
ignore = [
    "S101",  # assert marks internal invariants and test checks
    "S608",  # SQL is built from fixed column lists; values are always bound parameters
    "B008",  # FastAPI dependency defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S310", "E501"]
