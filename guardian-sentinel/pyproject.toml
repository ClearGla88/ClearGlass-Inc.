[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-sentinel"
version = "0.1.0.dev0"
description = "Design-mode core of a consent-based personal-safety assistant: trusted configuration, observation integrity, policy, alert and emergency state machines. No sensors, outputs or dispatch."
readme = "README.md"
requires-python = ">=3.10"
# Licensing follows the repository LICENSE (ClearGlass Inc. proprietary).
dependencies = []  # standard library only

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
guardian-sentinel = "guardian_core.cli:main"

[tool.setuptools]
packages = ["guardian_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
