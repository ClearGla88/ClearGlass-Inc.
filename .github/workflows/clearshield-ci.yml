# ClearShield CI: lint, the unit and integration suite on every supported Python
# (3.10 is the declared minimum and is not available in the authoring
# environment, so this job is its only test), and the Linux smoke script, which
# runs on the runner as its normal unprivileged user.
#
# Security posture: read-only token, no secrets, no deploy, no writes,
# credentials not persisted. Action SHAs are the pins already used in this
# repository (checkout v6.0.3, setup-python v6.2.0).
name: ClearShield CI

on:
  pull_request:
    paths:
      - "clearshield/**"
      - ".github/workflows/clearshield-ci.yml"
  push:
    branches: [main]
    paths:
      - "clearshield/**"
      - ".github/workflows/clearshield-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clearshield-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: clearshield
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools (the package itself has no dependencies)
        run: python -m pip install pytest==9.1.1 ruff==0.16.9
      - name: Lint (syntax errors and pyflakes)
        run: ruff check --select E9,F .
      - name: Unit and integration tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Linux smoke test (unprivileged runner user)
        run: python tests/smoke/linux_smoke.py
      - name: Package builds and installs with no dependencies
        run: |
          python -m pip install .
          clearshield --version
