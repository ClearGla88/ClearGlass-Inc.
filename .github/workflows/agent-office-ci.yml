# ClearGlass Agent Office CI: lint, the full test suite (including the PostgreSQL
# 16 schema tests), a deterministic Daily Operations Loop smoke run with audit
# verification, and the console's dependency audit, typecheck, and build.
#
# Security posture: read-only token, no secrets, no deploy, no writes,
# credentials not persisted. Action SHAs are the pins already used in this
# repository (checkout v6.0.3, setup-python v6.2.0, setup-node v4.4.0).
name: Agent Office CI

on:
  pull_request:
    paths:
      - "clearglass-agent-office/**"
      - ".github/workflows/agent-office-ci.yml"
  push:
    branches: [main]
    paths:
      - "clearglass-agent-office/**"
      - ".github/workflows/agent-office-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-office-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Core and API (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: clearglass-agent-office
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI database on the runner's private network; not a secret.
          POSTGRES_USER: office_ci
          POSTGRES_PASSWORD: office_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U office_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: clearglass-agent-office/requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (SQLite runtime + PostgreSQL 16 schema)
        env:
          OFFICE_TEST_PG_URL: postgresql://office_ci:office_ci@localhost:5432/postgres
        run: python -m pytest -rs -W error::DeprecationWarning
      - name: Daily Operations Loop smoke run
        run: |
          python office.py --db "$RUNNER_TEMP/ci.db" daily-loop --deterministic --json > "$RUNNER_TEMP/loop.json"
          python office.py --db "$RUNNER_TEMP/ci.db" verify-audit

  web:
    name: Console (typecheck, audit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clearglass-agent-office/apps/web
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clearglass-agent-office/apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
