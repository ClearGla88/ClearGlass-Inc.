# Baseline CI — the checks the current repository tree can actually run.
#
# This is the only workflow GitHub executes for this repository. The ~78
# workflow files at the repository root were uploaded flat (outside
# .github/workflows/) and are inert; most reference directories that are not in
# this tree. See README.md, "Repository status".
#
# Security posture: read-only token, no secrets, no pull_request_target, no
# writes, credentials not persisted in the checkout. Action pins below are
# reused from SHA pins already present in this repository's workflow files.
name: Baseline CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Block email exports, bytecode, build output, env files, keys, credentials
        run: python3 tools/repo_hygiene.py

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml; 3.13 is current.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint (syntax errors and pyflakes only)
        # The broader rule set reports pre-existing style findings; gate on correctness.
        run: |
          python -m pip install ruff==0.16.9
          ruff check --select E9,F .
      - name: Compile every tracked Python file
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile
      - name: Tests
        run: python -m pytest -q
      - name: Content agent smoke run
        run: >-
          python content_agent.py --seed content_seed.example.json
          --output "$RUNNER_TEMP/content-brief.md"
          --json-output "$RUNNER_TEMP/content-brief.json"
      - name: Agent-army orchestrator smoke run
        run: python orchestrator.py --request "Audit CI reliability" --format json > "$RUNNER_TEMP/plan.json"

  rust:
    name: Rust (clearglass-agent-crypto)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Toolchain the crate was verified with; Cargo.toml declares rust-version 1.85.
      RUSTUP_TOOLCHAIN: "1.97.0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
