# Builds the site from the website files in this repository and deploys it to
# GitHub Pages.
#
# Security posture:
# - Least privilege per job. The build job runs the site builder over repository
#   content, so it gets read-only scopes: `contents: read`, plus `pages: read` for
#   actions/configure-pages, which looks up the Pages site. Only the deploy job
#   holds `pages: write` and `id-token: write` (both required by
#   actions/deploy-pages), and it runs no repository code.
# - Every action is pinned to a full commit SHA. Each pin is the commit that
#   the floating tag used before resolved to on 2026-11-14, so the build and
#   deploy run the same action code as before. checkout uses the v6.0.3 pin
#   shared by every other workflow in this repo.
# - The checkout does not write the token into .git/config.
# - Only website files are published. The site shares the repository root with
#   source code, CI files, app projects and office documents; the previous
#   jekyll-build-pages step copied that whole root into the site (the root has
#   .nojekyll), so all of it was public. See tools/build_pages_site.py.
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

# One deployment at a time; queued runs are skipped, but an in-progress
# production deployment is never cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build site (website files only)
        run: python3 tools/build_pages_site.py --out _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
