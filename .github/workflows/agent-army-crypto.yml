name: Agent Army Rust Crypto

# The secure runtime crate (clearglass-agent-crypto) lives at the repository
# root in this tree: Cargo.toml, Cargo.lock, src/. It was written for an
# agent_army/secure_runtime/ layout, which does not exist here.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "AGENT_POLICY.md"
      - ".github/workflows/agent-army-crypto.yml"
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "AGENT_POLICY.md"
      - ".github/workflows/agent-army-crypto.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-army-crypto-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same pin as Baseline CI, so clippy -D warnings doesn't change with the runner image.
  RUSTUP_TOOLCHAIN: "1.97.0"

jobs:
  secure-runtime:
    name: Rust encryption validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install and verify Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustc --version
          cargo --version

      - name: Verify locked dependency graph
        run: |
          test -s Cargo.lock
          grep -F 'age = { version = "=0.12.1"' Cargo.toml
          cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run cryptographic tests
        run: cargo test --all-targets --all-features --locked

      - name: Build hardened release binary
        run: cargo build --release --locked

      - name: Validate CLI round trip and tamper rejection
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          binary="target/release/clearglass-secure"

          "$binary" keygen \
            --identity "$work/agent.identity" \
            --recipient "$work/agent.recipient"

          printf '%s\n' '{"plan_id":"ci-round-trip","classification":"confidential"}' > "$work/plan.json"
          "$binary" encrypt \
            --recipient "$work/agent.recipient" \
            --input "$work/plan.json" \
            --output "$work/plan.json.age"
          "$binary" decrypt \
            --identity "$work/agent.identity" \
            --input "$work/plan.json.age" \
            --output "$work/decrypted.json"
          cmp "$work/plan.json" "$work/decrypted.json"
          test "$(stat -c '%a' "$work/agent.identity")" = "600"
          test "$(stat -c '%a' "$work/decrypted.json")" = "600"

          cp "$work/plan.json.age" "$work/tampered.age"
          python - "$work/tampered.age" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          data = bytearray(path.read_bytes())
          data[-1] ^= 1
          path.write_bytes(data)
          PY

          if "$binary" decrypt \
            --identity "$work/agent.identity" \
            --input "$work/tampered.age" \
            --output "$work/must-not-exist.json"; then
            echo "tampered ciphertext unexpectedly decrypted" >&2
            exit 1
          fi
          test ! -e "$work/must-not-exist.json"
