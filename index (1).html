<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Shop – Curated Gifts for the Heart</title>
  <style>
    /* Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff5f8;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(90deg, #ff6fa4, #ff8ca8);
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: bold;
    }
    header nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      margin-left: 12px;
    }
    .container {
      flex: 1;
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 24px;
    }
    .product-card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.1s ease;
    }
    .product-card:hover {
      transform: translateY(-4px);
    }
    .product-image {
      background: #ffeaf0;
      height: 160px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5rem;
      color: #ff6fa4;
    }
    .product-info {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .product-info h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }
    .product-info p {
      flex: 1;
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 12px;
    }
    .product-info span {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #e91e63;
    }
    .product-info button {
      background: #e91e63;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s ease;
    }
    .product-info button:hover {
      background: #d81b60;
    }
    /* Cart overlay */
    #cart-overlay {
      position: fixed;
      top: 0;
      right: 0;
      width: 400px;
      max-width: 90%;
      height: 100vh;
      background: white;
      box-shadow: -4px 0 12px rgba(0, 0, 0, 0.2);
      transform: translateX(100%);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      z-index: 100;
    }
    #cart-overlay.open {
      transform: translateX(0);
    }
    #cart-header {
      background: #ff6fa4;
      color: white;
      padding: 16px;
      font-size: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #cart-header button {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
    }
    #cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    #cart-items .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    #cart-items .item span {
      font-size: 0.9rem;
    }
    #cart-footer {
      padding: 16px;
      border-top: 1px solid #f0f0f0;
    }
    #checkout-btn {
      background: #e91e63;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    #checkout-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <h1>Love Shop</h1>
    <nav>
      <a href="#" onclick="toggleCart(event)">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>
  <div class="container">
    <h2 style="margin-bottom: 16px;">Featured Products</h2>
    <div class="product-grid" id="product-grid"></div>
  </div>

  <!-- Cart Overlay -->
  <div id="cart-overlay">
    <div id="cart-header">
      <span>Your Cart</span>
      <button onclick="toggleCart(event)">&times;</button>
    </div>
    <div id="cart-items"></div>
    <div id="cart-footer">
      <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
        <span>Total:</span>
        <span id="cart-total">$0.00</span>
      </div>
      <button id="checkout-btn" onclick="checkout()">Checkout</button>
    </div>
  </div>

  <script>
    // Product catalogue
    const products = [
      {
        id: 1,
        name: 'Red Roses Bouquet',
        description: 'A dozen fresh red roses to show your love.',
        price: 29.99,
        emoji: '🌹'
      },
      {
        id: 2,
        name: 'Assorted Chocolates',
        description: 'A box of rich assorted chocolates in a heart-shaped tin.',
        price: 19.99,
        emoji: '🍫'
      },
      {
        id: 3,
        name: 'Heart Pendant Necklace',
        description: 'A delicate heart pendant on a sterling silver chain.',
        price: 49.99,
        emoji: '💖'
      },
      {
        id: 4,
        name: 'Love Teddy Bear',
        description: 'A soft teddy bear with a ribbon that says "Love".',
        price: 24.99,
        emoji: '🧸'
      },
      {
        id: 5,
        name: 'Romantic Candle Set',
        description: 'Set of scented candles to create a romantic atmosphere.',
        price: 14.99,
        emoji: '🕯️'
      }
    ];
    // Cart state
    const cart = {};

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';
      products.forEach((p) => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-image">${p.emoji}</div>
          <div class="product-info">
            <h3>${p.name}</h3>
            <p>${p.description}</p>
            <span>$${p.price.toFixed(2)}</span>
            <button onclick="addToCart(${p.id})">Add to Cart</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function addToCart(productId) {
      if (!cart[productId]) {
        cart[productId] = { qty: 1 };
      } else {
        cart[productId].qty++;
      }
      updateCartCount();
      renderCart();
    }

    function updateCartCount() {
      const count = Object.values(cart).reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-count').textContent = count;
    }

    function toggleCart(e) {
      e.preventDefault();
      const overlay = document.getElementById('cart-overlay');
      overlay.classList.toggle('open');
      renderCart();
    }

    function renderCart() {
      const cartItems = document.getElementById('cart-items');
      cartItems.innerHTML = '';
      let total = 0;
      Object.keys(cart).forEach((productId) => {
        const product = products.find((p) => p.id == productId);
        const qty = cart[productId].qty;
        const subtotal = qty * product.price;
        total += subtotal;
        const itemDiv = document.createElement('div');
        itemDiv.className = 'item';
        itemDiv.innerHTML = `
          <span>${qty} × ${product.name}</span>
          <span>$${subtotal.toFixed(2)}</span>
        `;
        cartItems.appendChild(itemDiv);
      });
      document.getElementById('cart-total').textContent = `$${total.toFixed(2)}`;
      // Disable checkout if cart is empty
      document.getElementById('checkout-btn').disabled = total === 0;
    }

    function checkout() {
      alert('Thank you for your purchase! This is a demo site.');
      // Clear cart
      for (const key in cart) delete cart[key];
      updateCartCount();
      renderCart();
      // Close cart
      document.getElementById('cart-overlay').classList.remove('open');
    }

    // Initialize
    renderProducts();
  </script>
</body>
</html>
